[project]
name = "speech-ai-lab-inference"
version = "0.1.0"
requires-python = ">=3.12"
description = "Inference optimization benchmarks: Whisper + Parakeet, FP32→FP16→INT8→TensorRT"
dependencies = [
    "openai-whisper>=20240930",
    "faster-whisper>=1.1.0",
    "datasets>=3.0.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "jiwer>=3.0.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "nemo_toolkit[asr]>=2.2.0",
    "huggingface-hub>=0.25.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
